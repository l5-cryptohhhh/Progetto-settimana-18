# Configurazione dei soli test: database in memoria e segreti finti.
# I valori veri stanno nelle variabili d'ambiente, qui servono solo
# per far partire il contesto senza chiedere niente a nessuno.

spring.datasource.url=jdbc:h2:mem:salone;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=prova@example.com
spring.mail.password=password-finta-solo-per-i-test

app.jwt.secret=segreto-di-prova-lungo-almeno-trentadue-caratteri
app.jwt.durata-ore=1
app.admin.email=admin@example.com
app.admin.nome=Amministratore di prova
app.admin.password=password-finta-solo-per-i-test
app.frontend.url=http://localhost:5173
app.mail.mittente=prova@example.com
